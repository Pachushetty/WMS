databases:
  - name: ecocycle-db
    plan: free
    databaseName: ecocycle
    user: ecocycle

services:
  - type: web
    name: ecocycle-ai
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd app && gunicorn app:app --timeout 120 --workers 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecocycle-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false   # set manually in the Render dashboard, never commit it
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
